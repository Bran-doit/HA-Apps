="p2remaining">0</dd></div><div><dt>Leben</dt><dd id="p2lives">4</dd></div><div><dt>Runde</dt><dd id="p2round">1</dd></div></dl></aside><span id="status" hidden></span><div id="overlay"><section class="card"><h2 id="title"></h2><p id="message"></p><p id="hint"></p><div id="actions"></div><img id="menu-art" src="pacman-comic-menu-v1.png" alt="Ein blauer Geist flieht durch ein buntes Comic-Labyrinth, während Pac-Man hinter ihm herrennt."></section></div><script>
(function(){
 const current='0.10.1';
 let started=false;
 function startGame(){if(started)return;started=true;const s=document.createElement('script');s.src='game.js?v='+encodeURIComponent(current);document.body.appendChild(s);}
 // Check once before starting. Network failure must never prevent local play.
 const fallback=setTimeout(startGame,2500);
 const manifest=new URL('version.json',location.href);manifest.searchParams.set('_check',Date.now());
 fetch(manifest.href,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('version');return r.json();}).then(data=>{
  if(started)return;
  const version=data.version;
  const target=new URL(location.href);
  if(typeof version==='string'&&/^\d+\.\d+\.\d+$/.test(version)&&version!==current&&target.searchParams.get('_tv_refresh')!==version){
   started=true;clearTimeout(fallback);target.searchParams.set('_tv_refresh',version);location.replace(target.href);return;
  }
  clearTimeout(fallback);startGame();
 }).catch(()=>{clearTimeout(fallback);startGame();});
})();
</script><span id="game-version" aria-label="Spielversion 0.10.1">v0.10.1</span></body></html>
