server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><script>location.replace("app/ki_kindersicherung_admin")</script><a href="app/ki_kindersicherung_admin">KI-Kindersicherung öffnen</a>';
    }
    location ~ ^/app/ki_kindersicherung_(admin|aufgabe|quiz|debug)$ {
        proxy_pass http://127.0.0.1:5050;
    }
    location ~ ^/api/appdaemon/ki_kindersicherung_admin_(status|config|action|logs|conversation)$ {
        proxy_pass http://127.0.0.1:5050;
    }
    location / { return 404; }
}
