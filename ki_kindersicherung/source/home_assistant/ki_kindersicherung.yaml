input_datetime:
  ki_sperre_bis:
    name: Kindersicherung bis
    has_date: false
    has_time: true

template:
  - sensor:
      - name: Kindersicherung Sprachgeräte
        unique_id: ki_sprachgeraete
        state: >-
          {% set ns = namespace(count=0) %}
          {% for satellite in states.assist_satellite %}
            {% set players = device_entities(device_id(satellite.entity_id)) | select('match', '^media_player\\.') | list %}
            {% if players | count > 0 %}{% set ns.count = ns.count + 1 %}{% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          devices: >-
            {% set ns = namespace(items=[]) %}
            {% for satellite in states.assist_satellite %}
              {% set dev = device_id(satellite.entity_id) %}
              {% set players = device_entities(dev) | select('match', '^media_player\\.') | list %}
              {% if players | count > 0 %}
                {% set label = device_attr(dev, 'name_by_user') or device_attr(dev, 'name') or state_attr(satellite.entity_id, 'friendly_name') or satellite.entity_id %}
                {% set ns.items = ns.items + [{'satellite': satellite.entity_id, 'device_id': dev, 'media_player': players[0], 'name': label}] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
      - name: Kindersicherung Sprachraum Media Player
        unique_id: ki_sprachraum_media_player
        state: >-
          {% set voice = states('input_select.ki_standard_sprachgeraet') %}
          {{ area_id(voice) or 'kein_bereich' }}
        attributes:
          area_name: >-
            {% set voice = states('input_select.ki_standard_sprachgeraet') %}
            {{ area_name(voice) or 'Kein Bereich' }}
          media_players: >-
            {% set voice = states('input_select.ki_standard_sprachgeraet') %}
            {% set room = area_id(voice) %}
            {{ area_entities(room) | select('match', '^media_player\\.') | list if room else [] }}

script:
  ki_sprachbefehl:
    alias: Kindersicherung Sprachbefehle
    description: >-
      Ausschließliches Werkzeug für Sprachbefehle der Kindersicherung. Verwende dieses
      Skript nur bei Aktivierung oder Deaktivierung der Kindersicherung, beim Anfordern,
      Beantworten, Wiederholen, Wechseln oder Beenden einer Lernaufgabe. Nicht verwenden
      für Filme, Serien, Musik, Radio, Medienwiedergabe, Räume, Geräte oder allgemeine
      Fragen ohne ausdrücklichen Bezug zu Kindersicherung oder Aufgabe.
      Beispiele: "Kindersicherung aktivieren", "bedingte Kindersicherung aktivieren",
      "Antwort neun", "Lösung Frühling Sommer Herbst Winter", "Aufgabe wiederholen",
      "andere Aufgabe", "eine Frage für Erwachsene" und "Kindersicherung
      deaktivieren 2468". Übergib die
      vollständige Äußerung unverändert im Feld text. Gib nach dem Aufruf keine
      eigene Bestätigung oder Antwort aus. Die Kindersicherung übernimmt die
      gesamte hörbare Rückmeldung selbst.
      Das Skript ist außerdem die Sprachschnittstelle des eigenständigen Wissensquiz.
      Beispiele: "Wissensquiz starten", "Antwort B", "nächster Spieler",
      "Quizfrage wiederholen" und "Wissensquiz beenden".
    icon: mdi:shield-microphone
    fields:
      text:
        name: Kindersicherungsbefehl
        description: >-
          Vollständiger erkannter Sprachtext, zum Beispiel "bedingte Kindersicherung
          aktivieren", "Antwort 12" oder "Kindersicherung deaktivieren 2468".
        required: true
        example: bedingte Kindersicherung aktivieren
        selector:
          text:
      device:
        name: Sprachgerät
        description: >-
          Optionale Entitäts- oder Gerätekennung des Assist-Geräts, das die Äußerung
          aufgenommen hat. Bei Aufgaben wird die Antwort an dieses Gerät ausgegeben.
        required: false
        default: home_assistant
        selector:
          text:
      user:
        name: Benutzer
        description: Optionale Benutzerkennung aus Home Assistant.
        required: false
        default: ""
        selector:
          text:
      source:
        name: Quelle
        description: Herkunft des Befehls, zum Beispiel assist, dashboard oder test.
        required: false
        default: assist
        selector:
          text:
    mode: queued
    sequence:
      - event: ki_kinderschutz_sprachbefehl
        event_data:
          text: "{{ text }}"
          device: "{{ device | default('home_assistant') }}"
          user: "{{ user | default('') }}"
          source: "{{ source | default('assist') }}"
      - variables:
          kindersicherung_ergebnis:
            status: angenommen
            message: ""
            speech: ""
      - stop: "{{ kindersicherung_ergebnis.message }}"
        response_variable: kindersicherung_ergebnis

