server {
    listen 8099;
    server_name _;

    allow 172.30.32.2;
    deny all;

    location = / {
        proxy_pass http://127.0.0.1:5050/app/shopping_sync_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
    }

    location / {
        proxy_pass http://127.0.0.1:5050/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
    }
}

