name: HA-Mediensteuerung auf Kodi
slug: ha_mediensteuerung_kodi
version: "0.5.0"
description: Deutsche Mediensuche, Kodi- und Emby-Steuerung mit Home-Assistant-Dashboard
url: https://github.com/Bran-doit/HA-Apps/tree/main/ha_mediensteuerung_kodi
arch:
  - amd64
stage: experimental
boot: manual
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
  - type: all_app_configs
    read_only: true
    path: /legacy_configs
options:
  mode: setup
  replace_existing_files: false
  legacy_appdaemon_slug: a0d7b954_appdaemon
schema:
  mode: list(setup|run)
  replace_existing_files: bool
  legacy_appdaemon_slug: match(^[a-zA-Z0-9_-]+$)
image: ghcr.io/bran-doit/ha-mediensteuerung-kodi-{arch}
